<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101113">
<title>じゃんけんガイド</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;background:#101113;color:#f5f5f5;touch-action:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;user-select:none;-webkit-user-select:none}
main{position:relative;width:min(100%,28rem);height:100%;height:100dvh;margin:auto}
#move{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f8e24b;font-size:clamp(2rem,16vmin,5rem);font-weight:700;line-height:1;white-space:nowrap}
.hands{position:absolute;left:max(1rem,env(safe-area-inset-left));right:max(1rem,env(safe-area-inset-right));bottom:max(1rem,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
button{height:clamp(3.25rem,14dvh,5.5rem);padding:0;border:1px solid #3c3e43;border-radius:.6rem;background:#222429;color:inherit;font:600 clamp(1rem,4vw,1.25rem)/1 system-ui,-apple-system,"Yu Gothic",sans-serif;touch-action:none;cursor:pointer}
button:active{background:#3c3e43}
button:focus-visible{outline:2px solid #f8e24b;outline-offset:2px}
</style>
<main>
<output id="move" aria-label="推奨手" aria-live="polite"></output>
<div class="hands" role="group" aria-label="相手の手">
<button type="button">グー</button><button type="button">チョキ</button><button type="button">パー</button>
</div>
</main>
<script>
const move=document.getElementById('move'),hands=['グー','チョキ','パー'],random=new Uint32Array(1);
function draw(){do{crypto.getRandomValues(random)}while(random[0]===4294967295);move.textContent=hands[random[0]%3]}
for(const button of document.querySelectorAll('button'))button.addEventListener('click',draw);
draw();
for(const name of ['touchmove','wheel','gesturestart','gesturechange','gestureend','dblclick'])document.addEventListener(name,e=>e.preventDefault(),{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','=','-','_','0','Add','Subtract'].includes(e.key))e.preventDefault()});
</script>
</html>
